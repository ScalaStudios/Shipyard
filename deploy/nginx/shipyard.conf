# Shipyard — nginx reverse proxy
# Copy to sites-available, set server_name + TLS, then reload nginx.
#
# sudo ln -s /path/to/shipyard.conf /etc/nginx/sites-enabled/shipyard
# sudo nginx -t && sudo systemctl reload nginx

upstream shipyard_api {
    server 127.0.0.1:8080;
}

upstream shipyard_ui {
    server 127.0.0.1:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name shipyard.example.com;

    # Uncomment after certificates exist:
    # return 301 https://$host$request_uri;

    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://shipyard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v2 {
        proxy_pass http://shipyard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://shipyard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /repository/ {
        proxy_pass http://shipyard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
    }

    location = /healthz {
        proxy_pass http://shipyard_api;
    }

    location = /readyz {
        proxy_pass http://shipyard_api;
    }

    location / {
        proxy_pass http://shipyard_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

