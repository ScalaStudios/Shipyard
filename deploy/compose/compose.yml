services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipyard
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
    ports:
      - "5432:5432"
    volumes:
      - shipyard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 5s
      timeout: 5s
      retries: 10

  shipyard-server:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
    environment:
      SHIPYARD_HTTP_ADDR: ":8080"
      SHIPYARD_DATABASE_URL: postgres://shipyard:shipyard@postgres:5432/shipyard?sslmode=disable
      SHIPYARD_MIGRATIONS_DIR: /app/migrations
      SHIPYARD_STORAGE_BACKEND: filesystem
      SHIPYARD_STORAGE_DIR: /data/blobs
      SHIPYARD_LOG_LEVEL: info
      SHIPYARD_ALLOW_REGISTER: "true"
      SHIPYARD_SESSION_TTL: 168h
      SHIPYARD_NODE_ID: server-1
      SHIPYARD_PUBLIC_URL: ${SHIPYARD_PUBLIC_URL:-http://127.0.0.1:5173}
      SHIPYARD_API_URL: ${SHIPYARD_API_URL:-http://127.0.0.1:8080}
      SHIPYARD_SECRETS_KEY: ${SHIPYARD_SECRETS_KEY:-}
      SHIPYARD_WEBHOOK_SECRET: ${SHIPYARD_WEBHOOK_SECRET:-}
      SHIPYARD_FORGE_OAUTH_FORGEJO_CLIENT_ID: ${SHIPYARD_FORGE_OAUTH_FORGEJO_CLIENT_ID:-}
      SHIPYARD_FORGE_OAUTH_FORGEJO_CLIENT_SECRET: ${SHIPYARD_FORGE_OAUTH_FORGEJO_CLIENT_SECRET:-}
      SHIPYARD_FORGE_OAUTH_FORGEJO_ISSUER: ${SHIPYARD_FORGE_OAUTH_FORGEJO_ISSUER:-}
      SHIPYARD_FORGE_OAUTH_GITHUB_CLIENT_ID: ${SHIPYARD_FORGE_OAUTH_GITHUB_CLIENT_ID:-}
      SHIPYARD_FORGE_OAUTH_GITHUB_CLIENT_SECRET: ${SHIPYARD_FORGE_OAUTH_GITHUB_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - shipyard_blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  shipyard-runner:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.runner
    environment:
      SHIPYARD_URL: http://shipyard-server:8080
      SHIPYARD_REGISTRATION_TOKEN: ${SHIPYARD_REGISTRATION_TOKEN:-}
      SHIPYARD_RUNNER_TOKEN: ${SHIPYARD_RUNNER_TOKEN:-}
      SHIPYARD_RUNNER_NAME: compose-runner
      SHIPYARD_RUNNER_LABELS: linux
      SHIPYARD_BUILDKIT_ADDR: tcp://buildkitd:1234
    depends_on:
      - shipyard-server
      - buildkitd
    profiles: ["runner"]

  buildkitd:
    image: moby/buildkit:v0.33.0
    privileged: true
    command: ["--addr", "tcp://0.0.0.0:1234"]
    profiles: ["runner"]

volumes:
  shipyard_pg:
  shipyard_blobs:
