name: shipyard

x-runner-env: &runner-env
  SHIPYARD_URL: http://shipyard-server:8080
  SHIPYARD_RUNNER_LABELS: jdk8,jdk11,jdk17,jdk21,jdk25,gradle
  SHIPYARD_RUNNER_TOKEN_FILE: /var/lib/shipyard/runner.token
  SHIPYARD_BUILDKIT_ADDR: tcp://buildkitd:1234
  SHIPYARD_BUILDKIT_TLS_DIR: /certs/buildkit
  SHIPYARD_WORKDIR: /var/lib/shipyard/work
  DOCKER_HOST: tcp://dind:2376
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client
  TESTCONTAINERS_HOST_OVERRIDE: dind

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipyard
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - shipyard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 5s
      timeout: 5s
      retries: 10

  shipyard-server:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
    restart: unless-stopped
    environment:
      SHIPYARD_HTTP_ADDR: ":8080"
      SHIPYARD_DATABASE_URL: postgres://shipyard:${POSTGRES_PASSWORD}@postgres:5432/shipyard?sslmode=disable
      SHIPYARD_MIGRATIONS_DIR: /app/migrations
      SHIPYARD_STORAGE_BACKEND: filesystem
      SHIPYARD_STORAGE_DIR: /data/blobs
      SHIPYARD_LOG_LEVEL: info
      SHIPYARD_ALLOW_REGISTER: ${SHIPYARD_ALLOW_REGISTER:-false}
      SHIPYARD_SESSION_TTL: 168h
      SHIPYARD_NODE_ID: flagship-01
      SHIPYARD_PUBLIC_URL: https://${SHIPYARD_DOMAIN}
      SHIPYARD_API_URL: https://${SHIPYARD_DOMAIN}
      SHIPYARD_SECRETS_KEY: ${SHIPYARD_SECRETS_KEY:?generate a base64 32-byte key}
      SHIPYARD_WEBHOOK_SECRET: ${SHIPYARD_WEBHOOK_SECRET:-}
    volumes:
      - shipyard_blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    restart: unless-stopped
    environment:
      SHIPYARD_DOMAIN: ":80"
      SHIPYARD_UPSTREAM: shipyard-server:8080
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - shipyard-server

  buildkit-certs:
    image: docker:29.9.2-dind
    entrypoint: ["sh", "/buildkit-certs.sh"]
    volumes:
      - ./buildkit-certs.sh:/buildkit-certs.sh:ro
      - shipyard_buildkit_certs:/certs

  buildkitd:
    image: moby/buildkit:v0.16.0
    restart: unless-stopped
    privileged: true
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --tlscacert
      - /certs/server/ca.pem
      - --tlscert
      - /certs/server/cert.pem
      - --tlskey
      - /certs/server/key.pem
    volumes:
      - type: volume
        source: shipyard_buildkit_certs
        target: /certs/server
        read_only: true
        volume:
          subpath: server
    depends_on:
      buildkit-certs:
        condition: service_completed_successfully

  dind:
    image: docker:29.9.2-dind
    restart: unless-stopped
    privileged: true
    entrypoint:
      - sh
      - -c
      - (while sleep 21600; do docker system prune -af --filter until=72h; docker volume prune -f; done) & exec dockerd-entrypoint.sh
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
    volumes:
      - shipyard_dind_certs:/certs
      - shipyard_dind_data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20

  shipyard-runner:
    build: &runner-build
      context: ../..
      dockerfile: deploy/compose/Dockerfile.runner.multijdk
    restart: unless-stopped
    environment:
      <<: *runner-env
      SHIPYARD_REGISTRATION_TOKEN: ${SHIPYARD_REGISTRATION_TOKEN:-}
      SHIPYARD_RUNNER_TOKEN: ${SHIPYARD_RUNNER_TOKEN:-}
      SHIPYARD_RUNNER_NAME: flagship-jdk21
    volumes:
      - shipyard_runner:/var/lib/shipyard
      - &dind-client-certs
        type: volume
        source: shipyard_dind_certs
        target: /certs/client
        read_only: true
        volume:
          subpath: client
      - &buildkit-client-certs
        type: volume
        source: shipyard_buildkit_certs
        target: /certs/buildkit
        read_only: true
        volume:
          subpath: client
    depends_on: &runner-deps
      shipyard-server:
        condition: service_started
      buildkitd:
        condition: service_started
      dind:
        condition: service_healthy
    profiles: ["runner"]

volumes:
  shipyard_pg:
  shipyard_blobs:
  shipyard_runner:
  shipyard_dind_certs:
  shipyard_dind_data:
  shipyard_buildkit_certs:
