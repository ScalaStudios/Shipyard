services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipyard
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - shipyard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 5s
      timeout: 5s
      retries: 10

  shipyard-server:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.server
    restart: unless-stopped
    environment:
      SHIPYARD_HTTP_ADDR: ":8080"
      SHIPYARD_DATABASE_URL: postgres://shipyard:${POSTGRES_PASSWORD}@postgres:5432/shipyard?sslmode=disable
      SHIPYARD_MIGRATIONS_DIR: /app/migrations
      SHIPYARD_STORAGE_BACKEND: filesystem
      SHIPYARD_STORAGE_DIR: /data/blobs
      SHIPYARD_LOG_LEVEL: info
      SHIPYARD_ALLOW_REGISTER: ${SHIPYARD_ALLOW_REGISTER:-false}
      SHIPYARD_SESSION_TTL: 168h
      SHIPYARD_NODE_ID: server-1
      SHIPYARD_PUBLIC_URL: https://${SHIPYARD_DOMAIN:?set SHIPYARD_DOMAIN in .env}
      SHIPYARD_API_URL: https://${SHIPYARD_DOMAIN}
      SHIPYARD_SECRETS_KEY: ${SHIPYARD_SECRETS_KEY:?generate with head -c 32 /dev/urandom | base64}
    volumes:
      - shipyard_blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    restart: unless-stopped
    environment:
      SHIPYARD_DOMAIN: ${SHIPYARD_DOMAIN}
      SHIPYARD_ACME_EMAIL: ${SHIPYARD_ACME_EMAIL:-admin@example.com}
      SHIPYARD_UPSTREAM: shipyard-server:8080
    ports:
      - "${SHIPYARD_HTTP_PORT:-80}:80"
      - "${SHIPYARD_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - shipyard-server

volumes:
  shipyard_pg:
  shipyard_blobs:
  caddy_data:
  caddy_config:
