name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Install LunarLabs Root CA
        run: |
          T="${RUNNER_TEMP:-/var/run/act}"
          curl -fsSL -o "$T/lunarlabs-root-ca.crt" http://cert.intra.lunarlabs.internal/LunarLabs-LLC-Root-CA.crt
          cat /etc/ssl/certs/ca-certificates.crt "$T/lunarlabs-root-ca.crt" > "$T/ca-bundle.crt"
          echo "NODE_EXTRA_CA_CERTS=$T/lunarlabs-root-ca.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$T/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "GIT_SSL_CAINFO=$T/ca-bundle.crt" >> "$GITHUB_ENV"
      - name: Use internal git host
        run: |
          git config --global url."https://git.intra.lunarlabs.internal/".insteadOf https://git.lunarlabs.dev/
          git config --global url."ssh://git@git.intra.lunarlabs.internal:222/".insteadOf ssh://git@git.lunarlabs.dev:222/
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Install LunarLabs Root CA
        run: |
          T="${RUNNER_TEMP:-/var/run/act}"
          curl -fsSL -o "$T/lunarlabs-root-ca.crt" http://cert.intra.lunarlabs.internal/LunarLabs-LLC-Root-CA.crt
          cat /etc/ssl/certs/ca-certificates.crt "$T/lunarlabs-root-ca.crt" > "$T/ca-bundle.crt"
          echo "NODE_EXTRA_CA_CERTS=$T/lunarlabs-root-ca.crt" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$T/ca-bundle.crt" >> "$GITHUB_ENV"
          echo "GIT_SSL_CAINFO=$T/ca-bundle.crt" >> "$GITHUB_ENV"
      - name: Use internal git host
        run: |
          git config --global url."https://git.intra.lunarlabs.internal/".insteadOf https://git.lunarlabs.dev/
          git config --global url."ssh://git@git.intra.lunarlabs.internal:222/".insteadOf ssh://git@git.lunarlabs.dev:222/
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
